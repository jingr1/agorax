version: 2
agents:
  # Implicit Hermes root profile (`~/.hermes`), not `~/.hermes/profiles/default`.
  - id: default
    name: Default
    displayName: Default
    role: Workspace Default
    specialty: general-purpose Hermes home profile
    mission: Default Hermes workspace agent rooted at ~/.hermes (skills, config, sessions).
    profile: default
    modes: []
    tools: []
    skills: []
    plugins: []
    pluginToolsets: []
    mcpServers: []
    capabilities: []
    preferredTaskTypes: []
    greenlightRequiredFor: []
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
    runtime: hermes
    execution: local
    dispatchable: false
    enabled: true
  - id: orchestrator
    name: Orchestrator
    role: Swarm Orchestrator / Greenlight Gate
    specialty: mission routing, task decomposition, handoffs, proof contracts, human approval gates
    mission: Decompose missions into safe, proof-bearing work and route to the right specialist while preserving human greenlight control.
    profile: orchestrator
    modes:
      - plan
      - autoresearch
      - autoresearch-dispatch
    tools:
      - todo
      - kanban
      - delegation
      - terminal
      - file
      - session_search
      - cronjob
      - skills
      - clarify
      - web
    skills:
      - orchestrator-core
      - mission-memory-layout
      - gstack-for-hermes
      - llm-wiki
      - kanban-orchestrator
      - writing-plans
      - autoresearch
      - autoresearch-plan
      - autoresearch-orchestrate
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: orchestrator:plan
    capabilities:
      - orchestration
      - decomposition
      - routing
      - proof-contracts
      - greenlight-gate
      - autoresearch-dispatch
    preferredTaskTypes:
      - orchestration
      - planning
      - routing
      - coordination
      - handoff
      - autoresearch-dispatch
    greenlightRequiredFor:
      - merge
      - publish
      - destructive
      - external-send
      - credential-change
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
    runtime: hermes
    execution: local
    dispatchable: true
    enabled: true
