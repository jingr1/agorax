name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  node:
    name: Node / ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hard gates — must stay green.
          - command: build
            continue_on_error: false
          - command: test
            continue_on_error: false
          - command: test:workspace
            continue_on_error: false
          - command: docs:check
            continue_on_error: false
          # Advisory — historical debt; keep visible but non-blocking for now.
          - command: lint
            continue_on_error: true
          - command: typecheck
            continue_on_error: true
    continue-on-error: ${{ matrix.continue_on_error }}
    env:
      AGORAX_AUTO_START_AGENT: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated runtime directories
        run: |
          hermes_home="${RUNNER_TEMP}/agorax/${{ matrix.command }}/hermes"
          collab_db="${RUNNER_TEMP}/agorax/${{ matrix.command }}/collab.db"
          echo "HERMES_HOME=${hermes_home}" >> "$GITHUB_ENV"
          echo "HERMES_COLLAB_DB=${collab_db}" >> "$GITHUB_ENV"
          mkdir -p "$hermes_home"
      - run: pnpm run ${{ matrix.command }}
      - name: Production startup and restart smoke
        if: matrix.command == 'build'
        run: pnpm run test:control-plane

  go-host:
    name: Go Host
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agorax-agent-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agorax-agent-daemon/go.work
          cache-dependency-path: agorax-agent-daemon/**/go.sum
      - run: go test ./packages/agent/host/... ./packages/agent/store-sqlite/... ./packages/agent/activity-replication/...

  python:
    name: Python Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hermes_langgraph_orchestrator/requirements.txt
      - name: Create isolated Hermes home
        run: |
          hermes_home="${RUNNER_TEMP}/agorax-python/hermes"
          echo "HERMES_HOME=${hermes_home}" >> "$GITHUB_ENV"
          mkdir -p "$hermes_home"
      - run: python -m pip install -r hermes_langgraph_orchestrator/requirements.txt
      - run: python -m pytest -q tests/test_langgraph_orchestrator.py
