name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  node:
    name: Node / ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [lint, typecheck, build, test, 'test:workspace', 'docs:check']
    env:
      AGORAX_AUTO_START_AGENT: 'false'
      HERMES_HOME: ${{ runner.temp }}/agorax/${{ matrix.command }}/hermes
      HERMES_COLLAB_DB: ${{ runner.temp }}/agorax/${{ matrix.command }}/collab.db
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated runtime directories
        run: |
          node -e "require('node:fs').mkdirSync(process.env.HERMES_HOME, { recursive: true })"
      - run: pnpm run ${{ matrix.command }}
      - name: Production startup and restart smoke
        if: matrix.command == 'build'
        run: pnpm run test:control-plane

  go-host:
    name: Go Host
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agorax-agent-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agorax-agent-daemon/go.work
          cache-dependency-path: agorax-agent-daemon/**/go.sum
      - run: go test ./packages/agent/host/... ./packages/agent/store-sqlite/... ./packages/agent/activity-replication/...

  python:
    name: Python Orchestrator
    runs-on: ubuntu-latest
    env:
      HERMES_HOME: ${{ runner.temp }}/agorax-python/hermes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hermes_langgraph_orchestrator/requirements.txt
      - run: python -m pip install -r hermes_langgraph_orchestrator/requirements.txt
      - run: python -m pytest -q tests/test_langgraph_orchestrator.py
